<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="admin-page">
<a class="skip-link" href="#main-content-wrapper">跳转到主要内容</a>
<div class="app-shell">
    <aside id="sidebarMenu" class="sidebar" aria-label="主导航">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">✦</div>
            <div><div class="brand-name">AI MCP Gateway</div><div class="brand-sub">CONNECT AI TO REAL WORLD</div></div>
        </div>
        <nav class="nav-stack">
            <div class="nav-label">网关管理</div>
            <a class="nav-link" href="#dashboard" data-target="dashboard"><i class="bi bi-house glyph" aria-hidden="true"></i><span>控制台</span></a>
            <a class="nav-link" href="#gateway-list" data-target="gateway-list"><i class="bi bi-grid-1x2 glyph" aria-hidden="true"></i><span>网关列表</span></a>

            <div class="nav-label nav-label-spaced">MCP 资源</div>
            <a class="nav-link" href="#datasource" data-target="datasource"><i class="bi bi-database glyph" aria-hidden="true"></i><span>数据源</span><span class="nav-count" id="nav-datasource-count">08</span></a>
            <a class="nav-link" href="#sql-template" data-target="sql-template"><i class="bi bi-file-earmark-code glyph" aria-hidden="true"></i><span>SQL 模板</span><span class="nav-count" id="nav-template-count">12</span></a>

        </nav>
        <div class="bridge-note" aria-hidden="true">Bridging<br>AI Agents<br>to Real Data<small>CONTROL PLANE</small><i></i></div>
        <div class="sidebar-foot">
            <div class="env"><i aria-hidden="true"></i><span>Development</span></div>
            <div class="env-sub">CN-SH · CONTROL DB HEALTHY</div>
            <button type="button" class="logout-link" id="logoutBtn"><i class="bi bi-box-arrow-left" aria-hidden="true"></i>退出登录</button>

    <main class="main-shell" id="main-content-wrapper" tabindex="-1">
        <header class="topbar" aria-label="页面工具栏">
            <div class="crumb"><i class="bi bi-house home" aria-hidden="true"></i><span>/</span><span>MCP</span><span>/</span><strong id="shell-crumb">控制台</strong></div>
            <div class="top-actions">
                <button class="icon-button" type="button" aria-label="查看系统通知"><i class="bi bi-bell" aria-hidden="true"></i><span class="notification-dot" aria-hidden="true"></span></button>
                <button class="icon-button" type="button" aria-label="打开帮助"><i class="bi bi-question-circle" aria-hidden="true"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
