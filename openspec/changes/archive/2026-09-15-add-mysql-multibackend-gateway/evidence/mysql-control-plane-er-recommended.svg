<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 22px; font-weight: 600; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .section { font-size: 13px; font-weight: 600; fill: #374151; }
    .entity-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .attr { font-size: 12px; fill: #374151; }
    .attr-muted { font-size: 12px; fill: #6b7280; }
    .relation { font-size: 11px; fill: #4b5563; }
    .cardinality { font-size: 12px; font-weight: 600; fill: #111827; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="60" y="42" class="title">MySQL 控制面推荐 ER 图（拟议，不代表已落地 DDL）</text>
  <text x="60" y="66" class="subtitle">复用现有 mcp_gateway_tool 与 Tool 转换链路；新增表仅承载 MySQL 协议、模板版本和数据源配置。</text>

  <rect x="60" y="88" width="18" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="86" y="102" class="relation">现有表</text>
  <rect x="158" y="88" width="18" height="18" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="184" y="102" class="relation">拟新增表</text>
  <rect x="274" y="88" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="300" y="102" class="relation">兼容性上下文</text>
  <line x1="430" y1="97" x2="462" y2="97" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="470" y="102" class="relation">逻辑关联（兼容多协议列）</text>
  <line x1="690" y1="97" x2="722" y2="97" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="102" class="relation">物理外键</text>

  <!-- Existing gateway binding -->
  <g id="mcp-gateway-tool">
    <rect x="60" y="170" width="300" height="220" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="60" y="170" width="300" height="42" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="60" y="204" width="300" height="8" fill="#dbeafe"/>
    <text x="78" y="196" class="entity-title">mcp_gateway_tool · 现有</text>
    <text x="78" y="236" class="attr" text-decoration="underline">id bigint unsigned · PK</text>
    <text x="78" y="258" class="attr">gateway_id varchar(64)</text>
    <text x="78" y="280" class="attr">tool_id bigint</text>
    <text x="78" y="302" class="attr">tool_name varchar(128)</text>
    <text x="78" y="324" class="attr">protocol_id bigint</text>
    <text x="78" y="346" class="attr">protocol_type varchar(8)</text>
    <text x="78" y="368" class="attr-muted">create_time / update_time</text>
    <text x="78" y="385" class="attr-muted">约束：protocol_type 区分 http / mysql</text>
  </g>

  <!-- Proposed MySQL protocol binding -->
  <g id="mcp-protocol-mysql">
    <rect x="455" y="170" width="295" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="455" y="170" width="295" height="42" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <rect x="455" y="204" width="295" height="8" fill="#dcfce7"/>
    <text x="473" y="196" class="entity-title">mcp_protocol_mysql · 拟新增</text>
    <text x="473" y="236" class="attr" text-decoration="underline">protocol_id bigint · PK</text>
    <text x="473" y="258" class="attr" font-style="italic">template_id bigint · FK</text>
    <text x="473" y="280" class="attr">status tinyint</text>
    <text x="473" y="302" class="attr-muted">create_time / update_time</text>
    <text x="473" y="330" class="attr-muted">一个协议绑定一个模板版本</text>
    <text x="473" y="348" class="attr-muted">允许多个 Tool 复用同一协议配置</text>
  </g>

  <!-- Proposed template -->
  <g id="mcp-mysql-template">
    <rect x="800" y="140" width="340" height="260" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="800" y="140" width="340" height="42" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <rect x="800" y="174" width="340" height="8" fill="#dcfce7"/>
    <text x="818" y="166" class="entity-title">mcp_mysql_template · 拟新增</text>
    <text x="818" y="206" class="attr" text-decoration="underline">id bigint unsigned · PK</text>
    <text x="818" y="228" class="attr">template_ref varchar(128)</text>
    <text x="818" y="250" class="attr">version varchar(32)</text>
    <text x="818" y="272" class="attr" font-style="italic">datasource_id bigint · FK</text>
    <text x="818" y="294" class="attr">sql_text longtext</text>
    <text x="818" y="316" class="attr">parameter_schema json</text>
    <text x="818" y="338" class="attr">status tinyint</text>
    <text x="818" y="360" class="attr">policy_* 查询上限列</text>
    <text x="818" y="382" class="attr-muted">唯一性：template_ref + version</text>
  </g>

  <!-- Proposed datasource -->
  <g id="mcp-mysql-datasource">
    <rect x="800" y="495" width="340" height="190" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="800" y="495" width="340" height="42" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <rect x="800" y="529" width="340" height="8" fill="#dcfce7"/>
    <text x="818" y="521" class="entity-title">mcp_mysql_datasource · 拟新增</text>
    <text x="818" y="561" class="attr" text-decoration="underline">id bigint unsigned · PK</text>
    <text x="818" y="583" class="attr">datasource_ref varchar(64)</text>
    <text x="818" y="605" class="attr">jdbc_url varchar(512)</text>
    <text x="818" y="627" class="attr">username varchar(128)</text>
    <text x="818" y="649" class="attr">password_ref varchar(256)</text>
    <text x="818" y="671" class="attr">status / pool / timeout</text>
  </g>

  <!-- Existing HTTP compatibility context -->
  <rect x="45" y="455" width="705" height="235" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="65" y="480" class="section">现有 HTTP 链路（兼容性上下文，不在本次 MySQL 表变更中改造）</text>
  <g id="mcp-protocol-http">
    <rect x="70" y="505" width="265" height="145" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="70" y="505" width="265" height="38" rx="8" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="70" y="535" width="265" height="8" fill="#e5e7eb"/>
    <text x="86" y="529" class="entity-title">mcp_protocol_http · 现有</text>
    <text x="86" y="565" class="attr" text-decoration="underline">id bigint · PK</text>
    <text x="86" y="586" class="attr">protocol_id bigint</text>
    <text x="86" y="607" class="attr">http_url / method / headers</text>
    <text x="86" y="628" class="attr">timeout / retry_times / status</text>
  </g>
  <g id="mcp-protocol-mapping">
    <rect x="410" y="505" width="315" height="145" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="410" y="505" width="315" height="38" rx="8" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="410" y="535" width="315" height="8" fill="#e5e7eb"/>
    <text x="426" y="529" class="entity-title">mcp_protocol_mapping · 现有</text>
    <text x="426" y="565" class="attr" text-decoration="underline">id bigint · PK</text>
    <text x="426" y="586" class="attr">protocol_id bigint</text>
    <text x="426" y="607" class="attr">mapping_type / parent_path</text>
    <text x="426" y="628" class="attr">field_name / mcp_path / sort_order</text>
  </g>

  <!-- Logical relation: existing polymorphic protocol_id -->
  <line x1="360" y1="270" x2="406" y2="270" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" data-graph-role="edge"/>
  <polygon points="430,270 406,284 406,256" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="430" y1="270" x2="455" y2="270" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" data-graph-role="edge"/>
  <text x="374" y="258" class="cardinality">N</text>
  <text x="440" y="258" class="cardinality">1</text>
  <text x="407" y="294" text-anchor="middle" class="relation">mysql</text>
  <text x="407" y="309" text-anchor="middle" class="relation">protocol_id</text>

  <!-- Physical relation: protocol to template -->
  <line x1="750" y1="270" x2="770" y2="270" stroke="#2563eb" stroke-width="1.5" data-graph-role="edge"/>
  <polygon points="785,270 770,282 770,258" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="785" y1="270" x2="800" y2="270" stroke="#2563eb" stroke-width="1.5" data-graph-role="edge"/>
  <text x="754" y="258" class="cardinality">N</text>
  <text x="789" y="258" class="cardinality">1</text>
  <text x="775" y="313" text-anchor="middle" class="relation">template</text>

  <!-- Physical relation: template to datasource -->
  <line x1="970" y1="400" x2="970" y2="437" stroke="#2563eb" stroke-width="1.5" data-graph-role="edge"/>
  <polygon points="970,452 958,437 982,437" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="970" y1="452" x2="970" y2="495" stroke="#2563eb" stroke-width="1.5" data-graph-role="edge"/>
  <text x="950" y="423" class="cardinality">N</text>
  <text x="950" y="484" class="cardinality">1</text>
  <text x="985" y="443" class="relation">runs on datasource</text>

  <!-- Existing HTTP relation inside the context -->
  <line x1="335" y1="578" x2="358" y2="578" stroke="#9ca3af" stroke-width="1.5" data-graph-role="edge"/>
  <polygon points="375,578 358,590 358,566" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="375" y1="578" x2="410" y2="578" stroke="#9ca3af" stroke-width="1.5" data-graph-role="edge"/>
  <text x="341" y="566" class="cardinality">1</text>
  <text x="382" y="566" class="cardinality">N</text>
  <text x="372" y="602" text-anchor="middle" class="relation">mapping</text>

  <text x="60" y="710" class="note">兼容约束：mcp_gateway_tool.protocol_id 不能增加单一物理 FK。</text>
  <text x="60" y="727" class="note">原因：同一列按 protocol_type 指向 HTTP 或 MySQL 协议配置。</text>
  <text x="60" y="748" class="subtitle">说明：模板版本一行一版，协议只引用已发布版本；密钥只保存 password_ref，不保存明文密码。</text>
</svg>
